name: 기능 제안
description: 사용하면서 필요한 기능이나 개선점을 제안해 주세요.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 상황에서 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 사용자가 어떤 방식으로 기능을 사용하게 될지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 참고 자료
      description: 현재 사용할 수 있는 방법이나 참고할 화면·링크가 있다면 적어 주세요.
